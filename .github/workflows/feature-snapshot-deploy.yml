name: Feature Snapshot Deploy

on:
  push:
    branches:
      - '*'
      - '**'
    paths:
      - 'Maven Project/**'

jobs:

  build:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Git user for version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Java Build Check
        run: |
          cd "Maven Project"
          mvn clean verify

      - name: Extract branch name
        id: extract_branch
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          BRANCH_NAME_SAFE=$(echo "$BRANCH_NAME" | sed 's#[^a-zA-Z0-9\-]#-#g')
          echo "branch_name=$BRANCH_NAME_SAFE" >> $GITHUB_OUTPUT

      - name: Get main branch version
        id: main_version
        run: |
          git fetch origin main:refs/remotes/origin/main
          MAIN_VERSION=$(mvn -f "Maven Project/pom.xml" help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "main_version=$MAIN_VERSION" >> $GITHUB_OUTPUT


      - name: Check and bump version if needed
        id: version_bump
        run: |
          cd "Maven Project"
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          MAIN_VERSION="${{ steps.main_version.outputs.main_version }}"
          BRANCH_NAME="${{ steps.extract_branch.outputs.branch_name }}"
          # If version already has branch name, skip
          if [[ "$CURRENT_VERSION" == *"-$BRANCH_NAME-SNAPSHOT" ]]; then
            echo "skip_bump=true" >> $GITHUB_OUTPUT
            echo "Version already set for this branch. Skipping bump."
          else
            # Parse versions
            parse_version() {
              local ver=$1
              ver=${ver%%-*} # Remove -SNAPSHOT or any suffix
              IFS='.' read -r maj min pat <<< "$ver"
              echo "$maj $min $pat"
            }
            read MAIN_MAJ MAIN_MIN MAIN_PAT <<< $(parse_version "$MAIN_VERSION")
            read CURR_MAJ CURR_MIN CURR_PAT <<< $(parse_version "$CURRENT_VERSION")
            # Compare versions
            if (( CURR_MAJ < MAIN_MAJ )) || { (( CURR_MAJ == MAIN_MAJ )) && (( CURR_MIN < MAIN_MIN )); } || { (( CURR_MAJ == MAIN_MAJ )) && (( CURR_MIN == MAIN_MIN )) && (( CURR_PAT <= MAIN_PAT )); }; then
              # Bump patch to be greater than main
              NEW_MAJ=$MAIN_MAJ
              NEW_MIN=$MAIN_MIN
              NEW_PAT=$((MAIN_PAT + 1))
              NEW_VERSION="$NEW_MAJ.$NEW_MIN.$NEW_PAT-$BRANCH_NAME-SNAPSHOT"
              mvn --batch-mode versions:set -DnewVersion=$NEW_VERSION
              mvn --batch-mode versions:commit
              echo "skip_bump=false" >> $GITHUB_OUTPUT
              echo "Bumped version to $NEW_VERSION (greater than main)"
            else
              # Current version is already greater than main, just add branch name
              VERSION_CLEAN=$(echo "$CURRENT_VERSION" | sed 's/-SNAPSHOT//')
              NEW_VERSION="$VERSION_CLEAN-$BRANCH_NAME-SNAPSHOT"
              mvn --batch-mode versions:set -DnewVersion=$NEW_VERSION
              mvn --batch-mode versions:commit
              echo "skip_bump=false" >> $GITHUB_OUTPUT
              echo "Set version to $NEW_VERSION (already greater than main)"
            fi
          fi

      - name: Commit and push version bump
        if: steps.version_bump.outputs.skip_bump == 'false'
        run: |
          git add "Maven Project/pom.xml"
          git commit -m "ci: set version with branch name [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF##*/}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Set up Java for deployment
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 7: Create a truststore and import the Nexus certificate
      - name: Create truststore
        run: |
          TRUSTSTORE="$GITHUB_WORKSPACE/nexus-truststore.jks"

          # Copy default truststore
          cp "$JAVA_HOME/lib/security/cacerts" "$TRUSTSTORE"

          # Make truststore writable
          chmod +w "$TRUSTSTORE"

          # Write Nexus cert
          echo "${{ secrets.NEXUS_CERT }}" > "$GITHUB_WORKSPACE/nexus.crt"

          # Import cert
          keytool -import -trustcacerts \
            -alias nexus \
            -file "$GITHUB_WORKSPACE/nexus.crt" \
            -keystore "$TRUSTSTORE" \
            -storepass changeit \
            -noprompt

          echo "TRUSTSTORE=$TRUSTSTORE" >> $GITHUB_ENV

      # Step 8: Configure Maven to use Nexus credentials
      - name: Configure Maven
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>nexus-snapshots</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
              <server>
                <id>nexus-releases</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

      # Step 9: Build and deploy the Maven Project to Nexus
      - name: Build and Deploy
        run: |
          cd "Maven Project"
          mvn clean deploy -U \
            -Djavax.net.ssl.trustStore="$TRUSTSTORE" \
            -Djavax.net.ssl.trustStorePassword=changeit
