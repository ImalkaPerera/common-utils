name: Release Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'Maven Project/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Git user for version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Step 1: Build and test the Maven Project to ensure no errors before version bump
      - name: Java Build Check
        run: |
          cd "Maven Project"
          mvn clean verify


      # Step 2: Increment patch version and set as release
      - name: Bump Maven version to next release
        run: |
          cd "Maven Project"
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Remove -SNAPSHOT if present
          VERSION_CLEAN=$(echo "$VERSION" | sed 's/-SNAPSHOT//')
          # Increment patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CLEAN"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          mvn --batch-mode versions:set -DnewVersion=$NEW_VERSION
          mvn --batch-mode versions:commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Commit and push the release version bump to the repository
      - name: Commit and push release version bump
        run: |
          git add "Maven Project/pom.xml"
          git commit -m "ci: set release version [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Set up Java for deployment
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 5: Create a truststore and import the Nexus certificate
      - name: Create truststore
        run: |
          TRUSTSTORE="$GITHUB_WORKSPACE/nexus-truststore.jks"

          # Copy default truststore
          cp "$JAVA_HOME/lib/security/cacerts" "$TRUSTSTORE"

          # Make truststore writable
          chmod +w "$TRUSTSTORE"

          # Write Nexus cert
          echo "${{ secrets.NEXUS_CERT }}" > "$GITHUB_WORKSPACE/nexus.crt"

          # Import cert
          keytool -import -trustcacerts \
            -alias nexus \
            -file "$GITHUB_WORKSPACE/nexus.crt" \
            -keystore "$TRUSTSTORE" \
            -storepass changeit \
            -noprompt

          echo "TRUSTSTORE=$TRUSTSTORE" >> $GITHUB_ENV

      # Step 6: Configure Maven to use Nexus credentials
      - name: Configure Maven
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>nexus-snapshots</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
              <server>
                <id>nexus-releases</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

      # Step 7: Build and deploy the Maven Project to Nexus Release repository
      - name: Build and Deploy Release
        run: |
          cd "Maven Project"
          mvn clean deploy -U \
            -Djavax.net.ssl.trustStore="$TRUSTSTORE" \
            -Djavax.net.ssl.trustStorePassword=changeit \
            -Prelease
