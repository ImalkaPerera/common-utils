name: Build and Deploy common-utils

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Write cert to file
      - name: Write Nexus cert
        run: |
          echo "${{ secrets.NEXUS_CERT }}" > nexus.crt

      # Configure Maven credentials
      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>nexus-snapshots</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
              <server>
                <id>nexus-releases</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

      # Build using JVM SSL override
      - name: Build and Deploy
        run: |
          cd "Maven Project"
          mvn clean deploy -U \
            -Djavax.net.ssl.trustStoreType=PEM \
            -Djavax.net.ssl.trustStore=nexus.crt