name: Build and Deploy common-utils

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) Setup Java
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3) Create custom truststore (DO NOT touch system cacerts)
      - name: Create custom truststore
        run: |
          echo "${{ secrets.NEXUS_CERT }}" > nexus.crt
          keytool -import -trustcacerts \
            -alias nexus \
            -file nexus.crt \
            -keystore nexus-truststore.jks \
            -storepass changeit \
            -noprompt

      # 4) Configure Maven credentials
      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>nexus-snapshots</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
              <server>
                <id>nexus-releases</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

      # 5) Build + Deploy using custom truststore
      - name: Build and Deploy
        run: |
          cd "Maven Project"
          mvn clean deploy -U \
            -Djavax.net.ssl.trustStore=../nexus-truststore.jks \
            -Djavax.net.ssl.trustStorePassword=changeit