name: Build and Deploy common-utils

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔥 Create TRUSTSTORE safely in runner temp
      - name: Create truststore
        run: |
          TRUSTSTORE=$RUNNER_TEMP/nexus-truststore.jks

          # Copy default Java truststore
          cp "$JAVA_HOME/lib/security/cacerts" "$TRUSTSTORE"

          # Write cert
          echo "${{ secrets.NEXUS_CERT }}" > $RUNNER_TEMP/nexus.crt

          # Import cert
          keytool -import -trustcacerts \
            -alias nexus \
            -file $RUNNER_TEMP/nexus.crt \
            -keystore "$TRUSTSTORE" \
            -storepass changeit \
            -noprompt

          echo "TRUSTSTORE=$TRUSTSTORE" >> $GITHUB_ENV

      # Maven settings
      - name: Configure Maven
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>nexus-snapshots</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
              <server>
                <id>nexus-releases</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}

      # Build
      - name: Build and Deploy
        run: |
          cd "Maven Project"
          mvn clean deploy -U \
            -Djavax.net.ssl.trustStore=$TRUSTSTORE \
            -Djavax.net.ssl.trustStorePassword=changeit